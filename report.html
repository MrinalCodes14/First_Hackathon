<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Report an Issue - CivicDrishti</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .report-page {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px
        }

        .report-page h1 {
            text-align: center
        }

        .report-page>p {
            text-align: center;
            color: #68747e;
            margin: 10px 0 30px
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, .06)
        }

        .form-group {
            margin-bottom: 20px
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d7dee2;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            box-sizing: border-box
        }

        .form-group textarea {
            resize: vertical
        }

        .upload-box {
            border: 2px dashed #cfd8d3;
            border-radius: 12px;
            padding: 25px;
            text-align: center
        }

        .upload-box input {
            margin-top: 15px
        }

        .preview {
            display: none;
            max-width: 250px;
            max-height: 180px;
            margin: 15px auto 0;
            border-radius: 10px
        }

        .location-box {
            background: #f5faf7;
            padding: 18px;
            border-radius: 10px
        }

        .location-box button {
            padding: 10px 15px;
            border: 0;
            border-radius: 7px;
            background: #299e65;
            color: white;
            cursor: pointer
        }

        .coordinates {
            display: flex;
            gap: 30px;
            margin-top: 15px
        }

        .coordinates p {
            margin: 0;
            color: #68747e
        }

        .coordinates span {
            display: block;
            color: #222;
            font-weight: bold;
            margin-top: 4px
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 9px;
            background: #299e65;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer
        }

        .success {
            display: none;
            background: #e8f7ee;
            color: #258b55;
            padding: 14px;
            border-radius: 9px;
            margin-top: 18px;
            text-align: center
        }
    </style>
</head>

<body>
    <header class="navbar">
        <div class="logo">
            <div class="logo-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M128 252.6C128 148.4 214 64 320 64C426 64 512 148.4 512 252.6C512 371.9 391.8 514.9 341.6 569.4C329.8 582.2 310.1 582.2 298.3 569.4C248.1 514.9 127.9 371.9 127.9 252.6zM320 320C355.3 320 384 291.3 384 256C384 220.7 355.3 192 320 192C284.7 192 256 220.7 256 256C256 291.3 284.7 320 320 320z"/></svg></div>
            <div>
                <h2>CivicDrishti</h2>
                <p>You Report. We Resolve.</p>
            </div>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="myreports.html">My Reports</a>
            <a href="how-it-works.html">How It Works</a>
            <a href="contacts.html">Contact</a>
        </nav>
        <div class="nav-buttons">
            <button class="notification" onclick="showNotifications()">🔔</button>
            <button class="login-btn" onclick="location.href='login.html'">Login</button>
            <button class="signup-btn" onclick="location.href='signup.html'">Sign Up</button>
        </div>
    </header>
    <main class="report-page">
        <span class="small-title">📢 REPORT A CIVIC ISSUE</span>
        <h1>Help us make your <span>city better</span></h1>
        <p>Tell us what is wrong, add a photo and share the location.</p>
        <div class="form-card">
            <form id="reportForm">
                <div class="form-group">
                    <label for="category">Issue Category *</label>
                    <select id="category" required>
                        <option value="">Select a category</option>
                        <option value="Pothole">Pothole</option>
                        <option value="Garbage">Garbage</option>
                        <option value="Streetlight">Streetlight</option>
                        <option value="Water Leakage">Water Leakage</option>
                        <option value="Road Damage">Road Damage</option>
                        <option value="Others">Others</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="description">Description *</label>
                    <textarea id="description" rows="5" placeholder="Describe the issue..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="address">Location / Address *</label>
                    <textarea id="address" rows="3" placeholder="Enter the location or nearby landmark..."
                        required></textarea>
                </div>
                <div class="form-group">
                    <label for="photo">Photo</label>
                    <div class="upload-box">
                        <p>📷 Choose a photo of the issue</p>
                        <input id="photo" type="file" accept="image/*">
                        <img id="preview" class="preview" alt="Selected issue photo">
                    </div>
                </div>
                <div class="form-group">
                    <label>Current Location</label>
                    <div class="location-box">
                        <button type="button" id="locationButton">📍 Use My Location</button>
                        <div class="coordinates">
                            <p>Latitude<span id="latitude">Not available</span></p>
                            <p>Longitude<span id="longitude">Not available</span></p>
                        </div>
                    </div>
                </div>
                <button class="submit-btn" type="submit">Submit Report</button>
                <div class="success" id="successMessage"></div>
            </form>
        </div>
    </main>
    <script>
        let selectedPhoto = "";
        let latitude = "";
        let longitude = "";

        const photo = document.getElementById("photo");
        const preview = document.getElementById("preview");

        photo.addEventListener("change", () => {
            const file = photo.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                selectedPhoto = e.target.result;
                preview.src = selectedPhoto;
                preview.style.display = "block";
            };
            reader.readAsDataURL(file);
        });

        document.getElementById("locationButton").addEventListener("click", () => {
            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser.");
                return;
            }
            navigator.geolocation.getCurrentPosition(
                position => {
                    latitude = position.coords.latitude.toFixed(6);
                    longitude = position.coords.longitude.toFixed(6);
                    document.getElementById("latitude").textContent = latitude;
                    document.getElementById("longitude").textContent = longitude;
                },
                () => {
                    alert("Unable to get your location. Please enter the address manually.");
                }
            );
        });
        document.getElementById("reportForm").addEventListener("submit", e => {
            e.preventDefault();
            const report = {
                id: Date.now(),
                category: document.getElementById("category").value,
                description: document.getElementById("description").value.trim(),
                address: document.getElementById("address").value.trim(),
                photo: selectedPhoto,
                latitude: latitude,
                longitude: longitude,
                status: "Reported",
                createdAt: new Date().toLocaleString()
            };

            const reports = JSON.parse(localStorage.getItem("civicReports") || "[]");
            reports.unshift(report);
            localStorage.setItem("civicReports", JSON.stringify(reports));
            document.getElementById("successMessage").textContent = "✅ Report submitted successfully! Report ID: CD-" + String(report.id).slice(-6);
            document.getElementById("successMessage").style.display = "block";
            document.getElementById("reportForm").reset();
            selectedPhoto = "";
            latitude = "";
            longitude = "";
            preview.src = "";
            preview.style.display = "none";
            document.getElementById("latitude").textContent = "Not available";
            document.getElementById("longitude").textContent = "Not available";
            setTimeout(() => location.href = "myreports.html", 1500);
        });
    </script>
</body>

</html>
