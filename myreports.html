<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>My Reports - CivicDrishti</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .reports-page {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px
        }

        .reports-page h1 {
            text-align: center
        }

        .reports-page>p {
            text-align: center;
            color: #68747e;
            margin-bottom: 30px
        }

        .reports-container {
            display: grid;
            gap: 18px
        }

        .report-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .06);
            display: flex;
            gap: 20px
        }

        .report-photo {
            width: 150px;
            height: 120px;
            border-radius: 10px;
            object-fit: cover;
            background: #eef4f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px
        }

        .report-details {
            flex: 1
        }

        .report-details h3 {
            margin: 0 0 8px
        }

        .report-details p {
            margin: 7px 0;
            color: #68747e
        }

        .report-status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #e8f7ee;
            color: #258b55;
            font-size: 13px;
            font-weight: bold
        }

        .empty {
            text-align: center;
            background: white;
            padding: 50px 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .06)
        }

        .empty button {
            margin-top: 15px;
            padding: 12px 20px;
            border: 0;
            border-radius: 8px;
            background: #299e65;
            color: white;
            font-weight: bold;
            cursor: pointer
        }

        .delete-btn {
            margin-top: 10px;
            padding: 7px 12px;
            border: 0;
            border-radius: 6px;
            background: #f3eeee;
            color: #c44;
            cursor: pointer
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <div class="logo-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M128 252.6C128 148.4 214 64 320 64C426 64 512 148.4 512 252.6C512 371.9 391.8 514.9 341.6 569.4C329.8 582.2 310.1 582.2 298.3 569.4C248.1 514.9 127.9 371.9 127.9 252.6zM320 320C355.3 320 384 291.3 384 256C384 220.7 355.3 192 320 192C284.7 192 256 220.7 256 256C256 291.3 284.7 320 320 320z"/></svg></div>
            <div>
                <h2>CivicDrishti</h2>
                <p>You Report. We Resolve.</p>
            </div>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="myreports.html" class="active">My Reports</a>
            <a href="how-it-works.html">How It Works</a>
            <a href="contacts.html">Contact</a>
        </nav>
        <div class="nav-buttons">
            <button class="notification" onclick="showNotifications()">🔔</button>
            <button class="login-btn" onclick="location.href='login.html'">Login</button>
            <button class="signup-btn" onclick="location.href='signup.html'">Sign Up</button>
        </div>
    </header>
    <main class="reports-page">
        <span class="small-title">📋 YOUR REPORTS</span>
        <h1>My <span>Reports</span></h1>
        <p>Track the civic issues you have reported.</p>
        <div class="reports-container" id="reportsContainer"></div>
    </main>
    <script>
        function getReports() {
            return JSON.parse(localStorage.getItem("civicReports") || "[]");
        }

        function showNotifications() {
            const reports = getReports();
            alert(reports.length ? `You have ${reports.length} report${reports.length === 1 ? "" : "s"} saved on this device.` : "You have no reports yet.");
        }
        function iconFor(category) {
            const icons = { "Pothole": "🕳️", "Garbage": "🗑️", "Streetlight": "💡", "Water Leakage": "💧", "Road Damage": "🛣️", "Others": "•••" };
            return icons[category] || "📍";
        }
        function escapeHtml(value) {
            return String(value || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c]));
        }

        function renderReports() {
            const container = document.getElementById("reportsContainer");
            const reports = getReports();

            if (!reports.length) {
                container.innerHTML = `<div class="empty"><h2>No reports yet</h2><p>You haven't reported any civic issue.</p><button onclick="location.href='report.html'">Report an Issue</button></div>`;
                return;
            }
            container.innerHTML = reports.map(r => {
                const image = r.photo ? `<img class="report-photo" src="${r.photo}" alt="Issue photo">` : `<div class="report-photo">${iconFor(r.category)}</div>`;
                return `<div class="report-card">${image}<div class="report-details"><h3>${escapeHtml(r.category)}</h3><p>📝 ${escapeHtml(r.description)}</p><p>📍 ${escapeHtml(r.address)}</p><p>🕒 ${escapeHtml(r.createdAt)}</p><span class="report-status">${escapeHtml(r.status)}</span><br><button class="delete-btn" onclick="deleteReport(${r.id})">Delete Report</button></div></div>`;
            }).join("");
        }
        function deleteReport(id) {
            if (!confirm("Delete this report?")) return;
            const reports = getReports().filter(r => r.id !== id);
            localStorage.setItem("civicReports", JSON.stringify(reports));
            renderReports();
        }
        renderReports();
    </script>
</body>

</html>
